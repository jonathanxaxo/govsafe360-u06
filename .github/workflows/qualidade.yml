name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes e controles estáticos
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar qualidade
        run: npm run quality
